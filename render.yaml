# Render blueprint for the Django API (the React app is deployed separately on Vercel).
# Render dashboard → New → Blueprint → pick this repository → fill in the `sync: false` values.
services:
  - type: web
    name: wx-truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Threads: requests are I/O-bound (routing + weather APIs); timeout covers slow upstreams.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --threads 8 --timeout 90 --access-logfile -
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      # Your Vercel production URL, e.g. https://weather-aware-truck-routing.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments, e.g. ^https://weather-aware-truck-routing-.*\.vercel\.app$
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false
      # Weather through the Cloudflare Worker proxy (infra/open-meteo-proxy), set in the
      # dashboard: OPEN_METEO_URL=https://<worker>.workers.dev/v1/forecast and
      # OPEN_METEO_PROXY_KEY=<the Worker's PROXY_KEY secret>. Render's outbound IPs are shared,
      # so Open-Meteo's per-IP free quota runs out; Worker traffic counts per Cloudflare account.
      # Shared cache for weather, place search and rate limits (the Key Value service below).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wx-truck-routing-cache
          property: connectionString

  # Free Redis-compatible store. Same region as the API so they talk over Render's private network.
  - type: keyvalue
    name: wx-truck-routing-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru # when full, drop the least recently used entries
    ipAllowList: [] # no public access; only services in this account can connect
